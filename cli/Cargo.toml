[package]
name = "zeekstd_cli"
version = "0.4.5"
description.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["zstd", "zstandard", "compression", "zstd-seekable-format", "cli"]
categories = ["compression", "command-line-utilities"]
homepage = "https://github.com/rorosen/zeekstd/tree/main/cli"
repository.workspace = true
readme = "README.md"

[[bin]]
name = "zeekstd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
memmap2 = "0.9.11"
zeekstd = { path = "../lib", version = "0.6.2" }
zstd-safe.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
